# PostgreSQL local (mismo motor que producción).
#   docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gestorpro
      POSTGRES_PASSWORD: gestorpro
      POSTGRES_DB: gestorpro
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gestorpro']
      interval: 5s
      retries: 10

volumes:
  pgdata:
